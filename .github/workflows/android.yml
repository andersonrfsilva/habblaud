name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'scripts/android-instrumented-ci.py'
      - 'scripts/android-smoke.ts'
      - 'server/**'
      - 'shared/**'
      - 'client/src/art/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.json'
  pull_request:
    paths:
      - '.github/workflows/android.yml'
      - 'android/**'
      - 'scripts/android-instrumented-ci.py'
      - 'scripts/android-smoke.ts'
      - 'server/**'
      - 'shared/**'
      - 'client/src/art/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipados:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ios.yml

  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # O pacote padrão `tools` saiu do repositório do SDK (o sdkmanager falha ao procurá-lo).
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :shared:testAndroidHostTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: android
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: xvfb-run -a ./gradlew :shared:jvmTest :desktop:createReleaseDistributable --max-workers=4
        working-directory: android

  instrumentado:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      # Runner sem /dev/kvm (o dos repositórios privados não tem virtualização aninhada): o emulador não sobe sem
      # aceleração, então os testes instrumentados ficam para o runner que tem, com um aviso no resumo da execução.
      - name: Enable KVM
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem /dev/kvm neste runner: os testes instrumentados do Android não rodaram."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.kvm.outputs.ok == 'true'
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          script: python3 scripts/android-instrumented-ci.py
      - name: Upload Android instrumentation diagnostics
        if: always() && steps.kvm.outputs.ok == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Android-instrumentation-${{ github.sha }}
          path: |
            android/build/instrumented-diagnostics/
            android/**/build/reports/androidTests/
            android/**/build/outputs/androidTest-results/
            android/**/build/outputs/**/TEST-*.xml
            android/**/build/outputs/**/test-result.pb
            android/**/build/outputs/**/logcat*.txt
          if-no-files-found: warn
