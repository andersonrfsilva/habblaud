[package]
name = "zaplaud-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }
png = "0.18"
roxmltree.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
zaplaud-core = { path = "../zaplaud-core" }

[target.'cfg(target_os = "linux")'.dependencies]
# Mesma versão e recursos que o keyring já usa; serve só para escolher uma coleção destrancada.
secret-service = { version = "4", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
